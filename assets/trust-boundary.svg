<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Trust boundary</title>
  <desc id="d">Only prompts you typed are counted. Tool output, subagent transcripts, pasted blocks, system reminders, harness context and peer-session messages are stripped first.</desc>
  <rect width="1200" height="400" rx="20" fill="#0f172a"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">Only your own words are mined</text>

    <!-- stripped -->
    <rect x="40" y="90" width="500" height="270" rx="16" fill="#1e293b" stroke="#be123c" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="70" y="128" font-size="20" font-weight="700" fill="#fda4af">Stripped before anything is counted</text>
    <g font-size="17" fill="#cbd5e1">
      <text x="72" y="170">✕  Tool output</text>
      <text x="72" y="204">✕  Subagent transcripts</text>
      <text x="72" y="238">✕  Pasted blocks</text>
      <text x="72" y="272">✕  System reminders and harness context</text>
      <text x="72" y="306">✕  Peer-session messages</text>
    </g>
    <text x="70" y="342" font-size="14" fill="#94a3b8">Instructions planted here would otherwise become standing skills.</text>

    <!-- filter -->
    <g transform="translate(570 225)">
      <path d="M0 -40L28 0L0 40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- counted -->
    <rect x="620" y="90" width="540" height="270" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="650" y="128" font-size="20" font-weight="700" fill="#bbf7d0">Counted</text>
    <g font-size="17" fill="#f0fdf4">
      <text x="652" y="170">✓  Prompts you typed</text>
      <text x="652" y="204">✓  The prompt right after you interrupted a turn</text>
    </g>
    <text x="650" y="252" font-size="18" font-weight="700" fill="#bbf7d0">Then, when drafting</text>
    <g font-size="16" fill="#dcfce7">
      <text x="652" y="284">→  Rules are restated, with no URLs, hosts, accounts or secrets</text>
      <text x="652" y="314">→  Nothing reaches ~/.claude/skills without your pick</text>
      <text x="652" y="344">→  Raw run output stays on your machine</text>
    </g>
  </g>
</svg>
