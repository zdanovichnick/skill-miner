<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">How skill-miner works</title>
  <desc id="d">Transcripts are mined offline by mine.js, classified and drafted by /skill-miner:mine, approved by you, then installed by /skill-miner:accept.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0f172a"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">From transcripts to installed skills</text>

    <!-- 1 transcripts -->
    <rect x="30" y="100" width="190" height="150" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="62" cy="130" r="14" fill="#334155"/><text x="62" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">1</text>
    <text x="125" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">Transcripts</text>
    <text x="125" y="192" text-anchor="middle" font-size="14" fill="#94a3b8">~/.claude/projects</text>
    <text x="125" y="212" text-anchor="middle" font-size="14" fill="#94a3b8">**/*.jsonl</text>
    <text x="125" y="232" text-anchor="middle" font-size="14" fill="#94a3b8">last 30 days</text>

    <!-- 2 mine.js -->
    <rect x="270" y="100" width="190" height="150" rx="14" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="302" cy="130" r="14" fill="#0e7490"/><text x="302" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#ecfeff">2</text>
    <text x="365" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#ecfeff">mine.js</text>
    <text x="365" y="192" text-anchor="middle" font-size="14" fill="#a5f3fc">offline, no deps</text>
    <text x="365" y="212" text-anchor="middle" font-size="14" fill="#a5f3fc">strips non-typed text</text>
    <text x="365" y="232" text-anchor="middle" font-size="14" fill="#a5f3fc">counts patterns</text>

    <!-- 3 report -->
    <rect x="510" y="100" width="190" height="150" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="542" cy="130" r="14" fill="#334155"/><text x="542" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">3</text>
    <text x="605" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">Candidates</text>
    <text x="605" y="192" text-anchor="middle" font-size="14" fill="#94a3b8">report.md</text>
    <text x="605" y="212" text-anchor="middle" font-size="14" fill="#94a3b8">candidates.json</text>
    <text x="605" y="232" text-anchor="middle" font-size="14" fill="#94a3b8">runs/&lt;date&gt;/</text>

    <!-- 4 classify -->
    <rect x="750" y="100" width="190" height="150" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <circle cx="782" cy="130" r="14" fill="#4338ca"/><text x="782" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2ff">4</text>
    <text x="845" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#eef2ff">/skill-miner:mine</text>
    <text x="845" y="192" text-anchor="middle" font-size="14" fill="#c7d2fe">classify, dedupe</text>
    <text x="845" y="212" text-anchor="middle" font-size="14" fill="#c7d2fe">draft up to 10</text>
    <text x="845" y="232" text-anchor="middle" font-size="14" fill="#c7d2fe">proposals/&lt;date&gt;/</text>

    <!-- 5 you -->
    <rect x="990" y="100" width="180" height="150" rx="14" fill="#713f12" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="1022" cy="130" r="14" fill="#a16207"/><text x="1022" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#fffbeb">5</text>
    <text x="1080" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#fffbeb">You pick</text>
    <text x="1080" y="192" text-anchor="middle" font-size="14" fill="#fde68a">keep or drop each</text>
    <text x="1080" y="212" text-anchor="middle" font-size="14" fill="#fde68a">dropped never</text>
    <text x="1080" y="232" text-anchor="middle" font-size="14" fill="#fde68a">comes back</text>

    <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arr)">
      <path d="M222 175H266"/><path d="M462 175H506"/><path d="M702 175H746"/><path d="M942 175H986"/>
    </g>

    <!-- accept -->
    <path d="M1080 252V300Q1080 322 1058 322H640" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
    <rect x="300" y="290" width="340" height="96" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="470" y="322" text-anchor="middle" font-size="19" font-weight="700" fill="#f0fdf4">/skill-miner:accept</text>
    <text x="470" y="348" text-anchor="middle" font-size="14" fill="#bbf7d0">skills → ~/.claude/skills/&lt;name&gt;/</text>
    <text x="470" y="368" text-anchor="middle" font-size="14" fill="#bbf7d0">memories, CLAUDE.md lines → their target file</text>
    <text x="1060" y="352" text-anchor="end" font-size="14" fill="#94a3b8">nothing is written</text>
    <text x="1060" y="372" text-anchor="end" font-size="14" fill="#94a3b8">without your pick</text>
  </g>
</svg>
