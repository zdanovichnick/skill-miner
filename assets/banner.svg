<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">skill-miner</title>
  <desc id="d">Banner: skill-miner turns your Claude Code transcripts into skills and memories you approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <!-- pickaxe + gem mark -->
  <g transform="translate(110 160)">
    <circle r="78" fill="#0b1226" stroke="#334155" stroke-width="2"/>
    <path d="M-40 -30 L0 -52 L40 -30 L52 6 L0 52 L-52 6 Z" fill="url(#gem)" opacity="0.95"/>
    <path d="M-40 -30 L0 -8 L40 -30 M0 -8 L0 52 M-52 6 L0 -8 L52 6" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <text x="230" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f8fafc">skill-miner</text>
  <text x="232" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Turn how you actually use Claude Code into skills and memories.</text>
  <text x="232" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Mines your own transcripts offline. Installs only what you approve.</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="232" y="258" width="132" height="32" rx="16" fill="#164e63"/>
    <text x="298" y="279" text-anchor="middle" fill="#a5f3fc">Node ≥ 18</text>
    <rect x="376" y="258" width="150" height="32" rx="16" fill="#312e81"/>
    <text x="451" y="279" text-anchor="middle" fill="#c7d2fe">no dependencies</text>
    <rect x="538" y="258" width="170" height="32" rx="16" fill="#14532d"/>
    <text x="623" y="279" text-anchor="middle" fill="#bbf7d0">runs locally</text>
    <rect x="720" y="258" width="104" height="32" rx="16" fill="#713f12"/>
    <text x="772" y="279" text-anchor="middle" fill="#fde68a">v0.1.0</text>
  </g>
</svg>
